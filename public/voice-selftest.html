<!DOCTYPE html>
<html lang="fr">
<head><meta charset="utf-8" /><title>Auto-test voix JARVIS</title></head>
<body>
<pre id="log">demarrage…</pre>
<script type="module">
const log = (t) => { document.getElementById("log").textContent += "\n" + t; };
try {
  log("import transformers.js…");
  const T = await import("https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2");
  log("import OK, version chargee");
  T.env.allowLocalModels = false;
  T.env.useBrowserCache = false; // le test ne doit pas masquer un probleme par le cache
  try { T.env.backends.onnx.wasm.numThreads = 1; log("numThreads=1 OK"); } catch (e) { log("numThreads: " + e.message); }
  log("chargement du processeur wavlm-base-sv…");
  const processor = await T.AutoProcessor.from_pretrained("Xenova/wavlm-base-sv");
  log("processeur OK");
  log("chargement du modele (q8, ~100 Mo)…");
  const model = await T.AutoModel.from_pretrained("Xenova/wavlm-base-sv", { quantized: true });
  log("modele OK");
  const audio = new Float32Array(16000); // 1 s de silence
  log("extraction des caracteristiques…");
  const inputs = await processor(audio);
  log("caracteristiques OK");
  const { embeddings } = await model(inputs);
  log("EMBEDDING OK : dimension " + embeddings.data.length + " premiers=[...]");
  log("RESULTAT: SUCCES — le modele fonctionne sur cette machine");
} catch (e) {
  log("ERREUR: " + (e && e.message ? e.message : String(e)));
  log("RESULTAT: ECHEC");
}
</script>
</body>
</html>
